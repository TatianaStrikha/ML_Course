services:
 # backend-приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile  # Тот, что в корне
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s # Между попытками будет пауза в 5 секунд
    env_file:
      - .env
    volumes:
      - .:/src # Монтируем весь корень проекта, чтобы видеть и config.py, и папку app
    depends_on:
       database:
        condition: service_healthy
       rabbitmq:
        condition: service_healthy
    networks:
      - event-planner-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


# база данных PostgreSQL
  database:
    image: postgres:16-alpine
    container_name: container-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./database:/var/lib/postgresql/data  # сохраняем базу данных
    networks:
      - event-planner-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

# воркер
  ml_worker:
    build:
      context: .  # Контекст сборки — корень всего проекта, чтобы воркер видел папки app и database
      dockerfile: ./ml_worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/src                     # Монтируем весь корень проекта в папку /src
    working_dir: /src              # Указываем /src как рабочую директорию
    command: python -m ml_worker.main # Запускаем как модуль из корня
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - event-planner-network
    deploy:
      replicas: 2  # для запуска 2 воркеров / либо docker-compose up -d --scale ml_worker=2 в командной строке


# Web-service (reverse proxy )
  nginx:
    image: nginx:latest
    container_name: container-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - event-planner-network

# брокер сообщений
  rabbitmq:
    image: rabbitmq:3.13.1-management
    container_name: container-rabbitmq
    restart: on-failure
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
    ports:
      - "15672:15672"  # management UI панель управления
      - "5672:5672"    # AMQP
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq  # сохранение данных очередей после перезапуска
    # command: rabbitmq-server
    networks:
      - event-planner-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 20s
      timeout: 10s
      retries: 3


# Networks
networks:
  event-planner-network:
     name: event-planner-network
     driver: bridge


# docker-compose down
# docker-compose up --build
# docker-compose up
# docker-compose up -d  Запустить в фоновом режиме

# docker-compose restart если были измеения в коде

# docker-compose stop
# docker-compose start